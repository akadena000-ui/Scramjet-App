<script>
/* ═══════════════════════════════════════════════════════════════
   EXACT SCRAMJET-APP PROXY ENGINE (not their UI)
   Source: https://github.com/MercuryWorkshop/Scramjet-App
           public/index.js + public/sw.js
   ═══════════════════════════════════════════════════════════════ */

document.title = "about:blank";
setInterval(function () {
  if (document.title !== "about:blank") document.title = "about:blank";
}, 2000);

var engineReady = false;
var scramjet = null;
var connection = null;

/** Same as Scramjet-App register-sw pattern */
async function registerSW() {
  if (!("serviceWorker" in navigator)) throw new Error("No serviceWorker");
  await navigator.serviceWorker.register("/sw.js", { scope: "/" });
  await navigator.serviceWorker.ready;
}

/**
 * Exact engine init from Scramjet-App public/index.js:
 *   const { ScramjetController } = $scramjetLoadController();
 *   const scramjet = new ScramjetController({ files: { ... } });
 *   scramjet.init();
 *   const connection = new BareMux.BareMuxConnection("/baremux/worker.js");
 */
async function initEngine() {
  try {
    if (typeof $scramjetLoadController !== "function") {
      console.warn("[ALEKS] /scram/scramjet.all.js not loaded — deploy on Scramjet-App");
      return false;
    }
    if (typeof BareMux === "undefined") {
      console.warn("[ALEKS] /baremux/index.js not loaded");
      return false;
    }

    await registerSW();

    var ScramjetController = $scramjetLoadController().ScramjetController;
    scramjet = new ScramjetController({
      files: {
        wasm: "/scram/scramjet.wasm.wasm",
        all: "/scram/scramjet.all.js",
        sync: "/scram/scramjet.sync.js",
      },
    });
    scramjet.init();

    connection = new BareMux.BareMuxConnection("/baremux/worker.js");

    engineReady = true;
    console.log("[ALEKS] Scramjet engine ready (Scramjet-App code)");
    return true;
  } catch (err) {
    console.warn("[ALEKS] engine init failed:", err);
    return false;
  }
}

/**
 * Exact navigate path from Scramjet-App:
 *   setTransport libcurl + wisp
 *   createFrame()
 *   frame.go(url)   ← REAL website URL, not their UI
 */
async function engineGo(iframe, realUrl) {
  if (!realUrl) return false;
  realUrl = String(realUrl).trim();
  if (!/^https?:\/\//i.test(realUrl)) realUrl = "https://" + realUrl;

  if (!engineReady || !scramjet || !connection) {
    console.warn("[ALEKS] engine not ready");
    return false;
  }

  try {
    var wispUrl =
      (location.protocol === "https:" ? "wss" : "ws") +
      "://" +
      location.host +
      "/wisp/";

    if ((await connection.getTransport()) !== "/libcurl/index.mjs") {
      await connection.setTransport("/libcurl/index.mjs", [
        { websocket: wispUrl },
      ]);
    }

    // Use their createFrame with OUR iframe (ALEKS chrome only)
    var frame = scramjet.createFrame(iframe);
    frame.go(realUrl);
    return true;
  } catch (err) {
    console.warn("[ALEKS] frame.go failed:", err);
    return false;
  }
}

function tickClock() {

  document.querySelector("#clock .t").textContent = d.toLocaleTimeString([], {

  });

function openWindow(opts) {
  var id = opts.id;
  if (windows[id]) {
    windows[id].el.classList.remove("minimized");
    focusWindow(id);
    return windows[id];
  }
  var win = document.createElement("div");
  win.className = "win";
  win.style.zIndex = ++winZ;
  var n = Object.keys(windows).length;
  win.style.top = 50 + n * 28 + "px";

  win.innerHTML =

    img(opts.iconKey || "info") +
    '</span><span class="w-name">' +
    (opts.name || "Window") +
    '</span><button class="win-btn min" type="button">—</button><button class="win-btn max" type="button">▢</button><button class="win-btn close" type="button">✕</button></div><div class="win-body"></div><div class="win-resize"></div>';
  var body = win.querySelector(".win-body");
  if (opts.build) opts.build(body);
  winLayer.appendChild(win);
  var title = win.querySelector(".win-title"),
    dragX = 0,
    dragY = 0,
    dragging = false;
  title.addEventListener("mousedown", function (e) {
    if (e.target.closest(".win-btn") || win.classList.contains("maximized")) return;
    dragging = true;
    dragX = e.clientX - win.offsetLeft;
    dragY = e.clientY - win.offsetTop;
    focusWindow(id);
    e.preventDefault();
  });
  document.addEventListener("mousemove", function (e) {
    if (!dragging) return;
    win.style.left = Math.max(0, Math.min(innerWidth - 80, e.clientX - dragX)) + "px";
    win.style.top = Math.max(0, Math.min(innerHeight - 80, e.clientY - dragY)) + "px";
  });
  document.addEventListener("mouseup", function () {
    dragging = false;
  });
  var rsz = win.querySelector(".win-resize"),
    rsX,
    rsY,
    rsW,
    rsH,
    resizing = false;
  rsz.addEventListener("mousedown", function (e) {
    if (win.classList.contains("maximized")) return;
    resizing = true;
    rsX = e.clientX;
    rsY = e.clientY;
    rsW = win.offsetWidth;
    rsH = win.offsetHeight;
    e.preventDefault();
    e.stopPropagation();
  });
  document.addEventListener("mousemove", function (e) {
    if (!resizing) return;
    win.style.width = Math.max(360, rsW + (e.clientX - rsX)) + "px";
    win.style.height = Math.max(240, rsH + (e.clientY - rsY)) + "px";
  });
  document.addEventListener("mouseup", function () {
    resizing = false;
  });
  win.querySelector(".close").onclick = function () {
    closeWindow(id);
  };
  win.querySelector(".min").onclick = function () {
    win.classList.add("minimized");
    updateTaskbar();
  };
  win.querySelector(".max").onclick = function () {
    win.classList.toggle("maximized");
  };
  win.addEventListener("mousedown", function () {
    focusWindow(id);
  });
  windows[id] = { el: win, name: opts.name, iconKey: opts.iconKey || "info" };
  focusWindow(id);
  return windows[id];
}
function closeWindow(id) {
  if (!windows[id]) return;
  windows[id].el.remove();
  delete windows[id];
  updateTaskbar();
}
function focusWindow(id) {
  if (!windows[id]) return;
  windows[id].el.style.zIndex = ++winZ;
  windows[id].el.classList.remove("minimized");
  Object.keys(windows).forEach(function (k) {
    windows[k].el.classList.remove("active");
  });
  windows[id].el.classList.add("active");
  updateTaskbar(id);
}
function updateTaskbar(activeId) {
  tasksEl.innerHTML = "";
  Object.keys(windows).forEach(function (id) {
    var w = windows[id],
      t = document.createElement("button");
    t.className = "task" + (id === activeId ? " active" : "");
    t.type = "button";
    t.innerHTML = img(w.iconKey) + "<span>" + w.name + "</span>";
    t.onclick = function () {
      if (w.el.classList.contains("minimized")) {
        w.el.classList.remove("minimized");
        focusWindow(id);
      } else if (parseInt(w.el.style.zIndex) === winZ) {
        w.el.classList.add("minimized");
        updateTaskbar();
      } else focusWindow(id);
    };
    tasksEl.appendChild(t);
  });
}
function proxyBar() {
  return (
    '<div class="proxy-bar ' +
    (engineReady ? "on" : "") +
    '"><span class="dot"></span>' +
    (engineReady
      ? "Scramjet engine · frame.go(real URL)"
      : "Engine offline · host with Scramjet-App") +
    "</div>"
  );
}

function openGames() {
  openWindow({
    id: "games",
    name: "Games",
    iconKey: "game",
    w: 880,
    h: 580,
    build: function (body) {
      var wrap = document.createElement("div");
      wrap.style.cssText = "display:flex;flex-direction:column;height:100%;min-height:0";
      wrap.innerHTML =
        proxyBar() +
        '<div class="hub"><input class="hub-search" placeholder="Search..."><div class="hub-content"></div></div>';
      body.appendChild(wrap);
      var search = wrap.querySelector(".hub-search"),
        content = wrap.querySelector(".hub-content");
      function build(f) {
        content.innerHTML = "";
        Object.keys(GAMES).forEach(function (cat) {
          var list = GAMES[cat].filter(function (g) {
            return !f || g.n.toLowerCase().indexOf(f) >= 0;
          });
          if (!list.length) return;
          var sec = document.createElement("div");
          sec.className = "cat";
          var html = "<h3>" + cat + '</h3><div class="games">';
          list.forEach(function (g) {
            html +=
              '<div class="game" data-u="' +
              g.u +
              '" data-n="' +
              g.n +
              '"><div class="thumb">' +
              img("game") +
              '</div><div class="info"><div class="name">' +
              g.n +
              '</div><div class="desc">' +
              g.d +
              "</div></div></div>";
          });
          html += "</div>";
          sec.innerHTML = html;
          content.appendChild(sec);
        });
        content.querySelectorAll(".game").forEach(function (el) {
          el.onclick = function () {
            openGame(el.getAttribute("data-u"), el.getAttribute("data-n"));
          };
        });
      }
      build("");
      search.oninput = function () {
        build(search.value.toLowerCase().trim());
      };
    },
  });
}

function openGame(realUrl, name) {
  openWindow({
    id: "game:" + name,
    name: name,
    iconKey: "game",
    w: 940,
    h: 620,
    build: function (body) {
      body.innerHTML =
        proxyBar() +
        '<div class="frame-host"><div class="loading">Scramjet frame.go…</div><iframe allow="fullscreen;gamepad;autoplay"></iframe></div>';
      var iframe = body.querySelector("iframe");
      var loading = body.querySelector(".loading");
      engineGo(iframe, realUrl).then(function (ok) {
        loading.style.display = ok ? "none" : "flex";
        if (!ok)
          loading.textContent =
            "Engine offline — deploy on Scramjet-App (see page source comment)";
        toast(ok ? name + " · Scramjet" : "Engine not loaded");
      });
    },
  });
}

function openBrowse() {
  openWindow({
    id: "browse",
    name: "Navigator",
    iconKey: "web",
    w: 1000,
    h: 680,
    build: function (body) {
      body.innerHTML =
        proxyBar() +
        '<div class="nav-shell"><div class="nav-chrome"><div class="nav-row">' +
        '<div class="nav-url"><input class="burl" placeholder="URL — Scramjet frame.go"><button class="go" type="button">Go</button></div></div></div>' +
        '<div class="frame-host"><div class="loading">Ready</div><iframe allow="fullscreen"></iframe></div></div>';
      var iframe = body.querySelector("iframe"),
        loading = body.querySelector(".loading"),
        input = body.querySelector(".burl");
      function go() {
        var v = input.value.trim();
        if (!v) return;
        if (!/^https?:\/\//i.test(v) && v.indexOf(".") === -1)
          v = "https://www.google.com/search?q=" + encodeURIComponent(v);
        else if (!/^https?:\/\//i.test(v)) v = "https://" + v;
        loading.style.display = "flex";
        engineGo(iframe, v).then(function (ok) {
          loading.style.display = ok ? "none" : "flex";
          if (!ok) loading.textContent = "Engine offline";
        });
      }
      body.querySelector(".go").onclick = go;
      input.onkeydown = function (e) {
        if (e.key === "Enter") go();
      };
    },
  });
}

function openCalc() {
  openWindow({
    id: "calc",
    name: "Calculator",
    iconKey: "calc",
    w: 350,
    h: 500,
    build: function (body) {
      body.innerHTML =
        '<div class="calc"><div class="calc-display">0</div><div class="calc-grid"></div></div>';
      var disp = body.querySelector(".calc-display"),
        grid = body.querySelector(".calc-grid"),
        expr = "";
      [
        ["C", "clr"],
        ["(", "op"],
        [")", "op"],
        ["/", "op"],
        ["7", ""],
        ["8", ""],
        ["9", ""],
        ["*", "op"],
        ["4", ""],
        ["5", ""],
        ["6", ""],
        ["-", "op"],
        ["1", ""],
        ["2", ""],
        ["3", ""],
        ["+", "op"],
        ["0", ""],
        [".", ""],
        ["⌫", "op"],
        ["=", "eq"],
      ].forEach(function (k) {
        var b = document.createElement("button");
        b.className = "calc-btn " + k[1];
        b.type = "button";
        b.textContent = k[0];
        b.onclick = function () {
          if (k[0] === "C") {
            expr = "";
            disp.textContent = "0";
            return;
          }
          if (k[0] === "⌫") {
            expr = expr.slice(0, -1);
            disp.textContent = expr || "0";
            return;
          }
          if (k[0] === "=") {
            try {
              expr = String(Function('"use strict";return (' + expr + ")")());
              disp.textContent = expr;
            } catch (e) {
              disp.textContent = "error";
              expr = "";
            }
            return;
          }
          expr += k[0];
          disp.textContent = expr;
        };
        grid.appendChild(b);
      });
    },
  });
}

var DESKTOP_APPS = [
  { id: "games", label: "Games", k: "game" },
  { id: "browse", label: "Web", k: "web" },
  { id: "roblox", label: "Roblox", k: "roblox" },
  { id: "notepad", label: "Notepad", k: "note" },

  { id: "settings", label: "Settings", k: "gear" },
];

function buildDesktop() {
  var root = document.getElementById("icons");
  root.innerHTML = "";
  DESKTOP_APPS.forEach(function (a) {
    var el = document.createElement("div");
    el.className = "icon";
    el.setAttribute("data-open", a.id);
    el.innerHTML =
      '<span class="ic">' + img(a.k) + '</span><span class="label">' + a.label + "</span>";
    root.appendChild(el);
  });
  var sm = document.getElementById("smGrid");
  sm.innerHTML = "";
  DESKTOP_APPS.concat([{ id: "about", label: "About", k: "info" }]).forEach(function (a) {
    var el = document.createElement("div");
    el.className = "sm-item";
    el.setAttribute("data-open", a.id);
    el.innerHTML = '<span class="ic">' + img(a.k) + "</span>" + a.label;
    sm.appendChild(el);
  });
  document.querySelectorAll("[data-open]").forEach(function (el) {
    el.addEventListener("click", function () {
      var app = el.getAttribute("data-open");
      if (APP_OPENERS[app]) APP_OPENERS[app]();
      document.getElementById("startmenu").classList.remove("on");
    });
  });
}
buildDesktop();

var startmenu = document.getElementById("startmenu");
document.getElementById("start").onclick = function (e) {
  e.stopPropagation();
  startmenu.classList.toggle("on");
};
document.getElementById("hideBtn").onclick = function (e) {
  e.stopPropagation();
  toggleCloak();
};
document.addEventListener("click", function (e) {
  if (
    !startmenu.contains(e.target) &&
    e.target.id !== "start" &&
    !e.target.closest("#start")
  )
    startmenu.classList.remove("on");
});

  }, 1500);
})();
